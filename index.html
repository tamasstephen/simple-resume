<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Simple Resume</title>
    <meta
      name="description"
      content="Build a resume in your browser and export a clean, automatically paginated A4 PDF. No account, no upload — your data never leaves your device."
    />
    <link rel="canonical" href="https://cvpeers.com/" />
    <meta name="theme-color" content="#f6f6f4" />
    <meta name="color-scheme" content="light" />

    <!-- Link previews. og:image is still absent: there is no card image yet,
         and a broken one renders worse than none. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cvpeers.com/" />
    <meta property="og:site_name" content="Simple Resume" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Simple Resume" />
    <meta
      property="og:description"
      content="Build a resume in your browser and export a clean, automatically paginated A4 PDF. No account, no upload — your data never leaves your device."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Simple Resume" />
    <meta
      name="twitter:description"
      content="Build a resume in your browser and export a clean, automatically paginated A4 PDF. No account, no upload — your data never leaves your device."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Simple Resume",
        "url": "https://cvpeers.com/",
        "description": "Build a resume in your browser and export a clean, automatically paginated A4 PDF. The preview is the printed document, so pages never need manual break handling.",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Resume builder",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Nine resume sections with rich-text descriptions",
          "Automatic A4 pagination — no manual page breaks",
          "Live preview that matches the exported PDF exactly",
          "PDF export through the browser's own print pipeline",
          "Local-first: data is stored in the browser, never uploaded"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
